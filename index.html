<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig the Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen game table — scoreboard bar, a "stage" panel for the current step, the active player's timeline below. Deliberately single dark "stage" look. */
:root{
  color-scheme: dark;
  --bg:#141127; --bg-2:#1c1834; --surface:#25203f; --surface-2:#2f2950; --line:#3d3666;
  --fg:#f5f1ff; --muted:#a8a2cc; --accent:#ffb547; --accent-ink:#2a1d03;
  --good:#3ddc97; --bad:#ff6b6b; --card-ink:#17132b;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Buttons */
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-align:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.big{min-height:56px;padding:14px 26px;font-size:17px}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--fg);color:var(--card-ink);border-color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tok{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 2px #0003;vertical-align:-.05em}

/* Home */
.home{display:flex;flex-direction:column;gap:28px;padding-top:6vh}
.hero{display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:clamp(44px,9vw,96px);font-weight:800;letter-spacing:-.02em;line-height:.95}
.lede{max-width:52ch;color:var(--muted);font-size:18px;margin-top:14px}
.disc{width:clamp(120px,22vw,220px);aspect-ratio:1;max-width:100%;border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 50%,var(--accent) 0 17%,var(--card-ink) 17.5% 19%,transparent 19.5%),
  repeating-radial-gradient(circle at 50% 50%,#0c0a19 0 2px,#221d3d 2px 4px);
  box-shadow:0 20px 50px #0008, inset 0 0 0 6px #0c0a19;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.home-actions{display:flex;flex-wrap:wrap;gap:12px}

/* Panels */
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:20px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:clamp(26px,4vw,36px)}

/* Setup */
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow input[type=text]{flex:1 1 180px;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;padding:10px 12px;min-height:44px}
.swatches{display:flex;gap:6px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw.sel{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px;display:inline-flex;gap:8px;align-items:center}
.chip .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chip.sel{background:var(--fg);color:var(--card-ink);border-color:var(--fg)}
.chip.sel .n{color:#4b4570}
.note{border-radius:10px;padding:12px 14px;background:var(--surface);border-left:4px solid var(--accent);font-size:15px}
.note.bad{border-left-color:var(--bad)}
.note.good{border-left-color:var(--good)}

/* Playlists (read-only) */
ul.problems{margin:0;padding-left:20px;font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
input.sheet{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;color:var(--fg);font:15px/1.4 var(--body);padding:12px;box-sizing:border-box;min-height:44px}
.grp{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.lrows{display:flex;flex-direction:column;gap:8px}
.lrow{background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lname{display:flex;flex-direction:column;min-width:0;flex:1 1 160px}
.lname span{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--surface);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
/* Import check screen */
.erows{display:flex;flex-direction:column;gap:8px}
.erow{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--good)}
.erow.flag{border-left-color:var(--accent)}
.erow.off{opacity:.5;border-left-color:var(--line)}
.enote{color:var(--accent);font-size:14px;font-weight:700}
.eraw{overflow-wrap:anywhere}
.efields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 80px 120px;gap:8px 10px}
.efields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.efields input{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;color:var(--fg);font:14px/1.3 var(--body);padding:8px 10px;min-height:40px;box-sizing:border-box;width:100%;min-width:0}
.efields input.bad{border-color:var(--bad)}
.ebtns{display:flex;gap:6px;flex-wrap:wrap}
.ebtns a.btn{text-decoration:none}
@media (max-width:699px){ .efields{grid-template-columns:1fr 1fr} }

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}
.score{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto;justify-content:center}
.pchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid transparent;border-radius:999px;padding:6px 12px 6px 8px;font-size:14px}
.pchip.active{border-color:var(--c)}
.pchip.dj{border-style:dashed;border-color:var(--muted)}
.pchip .dot{width:14px;height:14px}
.pchip b{max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .cards{font-family:var(--display);font-size:13px;font-variant-numeric:tabular-nums}
.pchip .tk{color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.tools{display:flex;gap:8px;position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:20;min-width:210px;box-shadow:0 14px 40px #0009}
.menu .btn{justify-content:flex-start;border-radius:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.badge{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--bad);color:var(--card-ink)}

/* Stage */
.stage{background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.stage-head{display:flex;flex-direction:column;gap:6px}
.stage-head h2{font-size:clamp(22px,3vw,30px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stage-head h2 .dot{width:18px;height:18px}
.stage-body{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.stage-col{display:flex;flex-direction:column;gap:12px;flex:1 1 280px;min-width:0}
.qrbox{background:#fff;border-radius:14px;padding:14px;width:248px;max-width:100%;box-sizing:border-box;flex:none}
.qrbox #qr img,.qrbox #qr canvas{display:block;width:100%;height:auto}
.url{font-size:12px;color:var(--muted);word-break:break-all;user-select:all}
.block{background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.block h3{font-family:var(--body);font-size:16px;font-weight:700}
.outcome{font-family:var(--display);font-size:clamp(22px,3.2vw,32px);font-weight:800}
.outcome.good{color:var(--good)} .outcome.bad{color:var(--bad)}
.lines{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.lines b{color:var(--fg)}

/* Board + timeline */
.board{display:flex;flex-direction:column;gap:10px;min-width:0}
.board-head{display:flex;align-items:center;gap:10px}
.board-head h2{font-size:18px}
.board-head .count{margin-left:auto;font-family:var(--display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.timeline{display:flex;align-items:stretch;overflow-x:auto;padding:12px 4px 16px;min-height:calc(var(--ch) + 28px);
  --cw:clamp(66px,7.2vw,108px);--ch:calc(var(--cw)*1.38);--sw:22px;
  background:linear-gradient(transparent calc(50% - 1px),var(--line) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px));scrollbar-width:thin}
.ycard{flex:none;width:var(--cw);height:var(--ch);border-radius:12px;background:var(--c);color:var(--card-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;box-sizing:border-box;text-align:center;box-shadow:0 6px 16px #0006;position:relative;overflow:hidden}
.ycard .yr{font-family:var(--display);font-weight:800;font-size:calc(var(--cw)*.27);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ycard .meta{display:flex;flex-direction:column;font-size:11px;line-height:1.2;min-width:0;width:100%}
.ycard .meta b,.ycard .meta span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ycard.new{outline:4px solid var(--fg);outline-offset:3px}
.ycard.mystery{background:var(--surface-2);color:var(--fg);border:2px dashed var(--accent);cursor:grab;touch-action:none;user-select:none}
.ycard.mystery.placed{border-style:solid}
.ycard.mystery.locked{cursor:default;border-color:var(--muted)}
.ycard.mystery.lifting{opacity:.35}
.ycard.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(-4deg) scale(1.06);box-shadow:0 18px 40px #000a;opacity:.95}
.vinyl{width:calc(var(--cw)*.66);aspect-ratio:1;border-radius:50%;flex:none;display:grid;place-items:center;
  background:repeating-radial-gradient(circle at 50% 50%,#0c0a19 0 1.5px,#29234a 1.5px 3px)}
.vinyl .label{width:42%;aspect-ratio:1;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:calc(var(--cw)*.14)}
.ycard.marker{background:transparent;border:3px dashed var(--c);color:var(--fg);box-shadow:none;font-weight:700;font-size:12px}
.ycard.marker .vinyl .label{background:var(--c)}
.slot{flex:none;width:var(--sw);border:0;padding:0;background:transparent;position:relative;cursor:default}
.slot::after{content:"";position:absolute;inset:8px 9px;border-radius:4px;background:transparent}
.slot.live{cursor:pointer}
.slot.live::after{background:var(--line)}
.slot.live:hover::after,.slot.hot::after{background:var(--accent);inset:0 7px}
.tray{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tray .ycard{--cw:96px;--ch:132px}

/* Ready-to-play card in stage (reveal) */
.bigcard{--cw:140px;--ch:190px}
.bigcard .yr{font-size:40px}
.bigcard .meta{font-size:13px}

/* Game over */
.standings{display:flex;flex-direction:column;gap:8px}
.standings div{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:12px 16px}
.standings .pts{margin-left:auto;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.win-title{font-size:clamp(32px,6vw,60px);font-weight:800}

/* Phone: vertical timeline */
@media (max-width:699px){
  .stage{padding:16px}
  .timeline{flex-direction:column;overflow-x:visible;padding:4px 0;min-height:0;background:linear-gradient(90deg,transparent calc(50% - 1px),var(--line) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px));--cw:100%;--ch:58px;--sw:100%}
  .timeline .ycard{flex-direction:row;justify-content:flex-start;gap:14px;padding:6px 14px;text-align:left;width:100%}
  .timeline .ycard .yr{font-size:24px;min-width:3.2ch}
  .timeline .ycard .meta{font-size:13px}
  .timeline .ycard .meta b,.timeline .ycard .meta span{-webkit-line-clamp:1}
  .timeline .vinyl{width:42px}
  .timeline .vinyl .label{font-size:11px}
  .slot{height:22px;width:100%}
  .slot::after{inset:9px 8px}
  .slot.live:hover::after,.slot.hot::after{inset:4px 0}
  .ycard.ghost{transform:scale(1.03)}
  .score{justify-content:flex-start}
  .pchip b{max-width:8ch}
}
</style>

</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
'use strict';
const TARGET = 10, START_TOKENS = 2, MAX_TOKENS = 5, SKIP_COST = 1, CHALLENGE_COST = 1, BUY_COST = 3;
const COLORS = ['#ff6b6b','#ffc145','#3ddc97','#4cc9f0','#b59cff','#ff7ac6'];
const COLOR_NAMES = ['Coral','Yellow','Mint','Sky','Violet','Pink'];

/* ---------- storage (always guarded) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- parsing ---------- */
function parseTable(text){
  text = String(text).replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  const first = text.split('\n', 1)[0];
  const delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"' && f === '') q = true;
    else if (c === delim){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function ytId(link){
  link = String(link || '').trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(link)) return link;
  const m = link.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m && /youtu/.test(link) ? m[1] : null;
}
const HEAD = {
  artist:['artist','artists'], title:['title','song','song_title'], year:['year','original_year','release_year'],
  link:['youtube_link','link','youtube','url','youtube_url'], start:['start_sec','start','start_second','start_seconds'],
  playlists:['playlists','playlist']
};
function parseStart(v){
  v = String(v).trim(); if (!v) return 0;
  let m = v.match(/^(\d+)$/); if (m) return +m[1];
  m = v.match(/^(\d+):([0-5]\d)$/); if (m) return +m[1] * 60 + +m[2];
  return null;
}
const norm = s => String(s||'').trim().toLowerCase().replace(/[\s_-]+/g,'_');
function importText(text){
  const rows = parseTable(text).map((r, i) => (r.rowNo = i + 1, r)).filter(r => r.some(c => String(c).trim() !== ''));
  if (!rows.length) return { error: 'Nothing to import. Paste rows from your Sheet, including the header row.' };
  const hdr = rows[0].map(norm); const col = {};
  for (const k in HEAD){ const i = hdr.findIndex(h => HEAD[k].includes(h)); if (i >= 0) col[k] = i; }
  const missing = ['artist','title','year','link'].filter(k => col[k] == null);
  if (missing.length) return { error: 'The first row needs these column names: artist, title, year, youtube_link. Missing: ' + missing.map(k => k === 'link' ? 'youtube_link' : k).join(', ') + '.' };
  const songs = [], problems = [], seen = {};
  for (let i = 1; i < rows.length; i++){
    const r = rows[i];
    const rowNo = r.rowNo;
    const g = k => col[k] == null ? '' : String(r[col[k]] ?? '').trim();
    const artist = g('artist'), title = g('title'), yr = g('year'), id = ytId(g('link'));
    const label = (artist || '?') + ' — ' + (title || '?');
    if (!artist || !title){ problems.push({ row: rowNo, msg: 'missing artist or title' }); continue; }
    if (!/^\d{4}$/.test(yr) || +yr < 1900 || +yr > 2100){ problems.push({ row: rowNo, msg: label + ': year "' + yr + '" is not a 4-digit year' }); continue; }
    if (!id){ problems.push({ row: rowNo, msg: label + ': not a YouTube link' }); continue; }
    if (seen[id]){ problems.push({ row: rowNo, msg: label + ': same video as row ' + seen[id] }); continue; }
    seen[id] = rowNo;
    const st = parseStart(g('start')) || 0;
    const pls = g('playlists').split(',').map(s => s.trim()).filter(Boolean);
    songs.push({ id, artist, title, year: +yr, start: st > 0 ? st : 0, playlists: [...new Set(pls)] });
  }
  return { songs, problems };
}

/* ---------- library ----------
   Two kinds of playlists, both read into the same shape { key, name, songs, mine }:
   - Admin playlists: CSV files in the repo's playlists/ folder, listed in playlists/index.json. Only the
     repo owner can change them (GitHub write access is the lock). Cached in nd_admin for offline starts.
   - Player playlists: imported from a YouTube playlist on a device and saved in nd_mylists, then added to
     the shared list (below) so every device sees them. A local copy keeps working if sharing fails. */
const YT_API_KEY = '';           // YouTube Data API v3 key, restricted to the site's address in Google Cloud.
const ADMIN_DIR = 'playlists/';
let admin = store.get('nd_admin', null) || { lists: [], problems: [], at: 0 };
let myLists = store.get('nd_mylists', []);
let failed = store.get('nd_failed', []);
const saveMine = () => store.set('nd_mylists', myLists);

function allLists(){
  const sharedIds = new Set(shared.lists.map(l => l.id));
  return [...admin.lists.map(l => ({ key: 'a:' + l.name, name: l.name, songs: l.songs, kind: 'admin' })),
          ...shared.lists.map(l => ({ key: 's:' + l.id, name: l.name, songs: l.songs, kind: 'shared', list: l })),
          ...myLists.filter(l => !(l.sharedId && sharedIds.has(l.sharedId))).map(l => ({ key: 'm:' + l.id, name: l.name, songs: l.songs, kind: 'mine', list: l }))];
}
/* Union of the selected playlists, one entry per YouTube video (admin data wins on a clash). Every song in
   the pool then has the same chance; newGame shuffles it once, so nothing repeats within a game. */
function selectionSongs(sel){
  const seen = new Map();
  allLists().filter(l => sel.includes(l.key)).forEach(l => l.songs.forEach(s => { if (!seen.has(s.id)) seen.set(s.id, s); }));
  return [...seen.values()];
}
/* Keep the selection to playlists that exist; old saves used names or '__all'. Empty → all admin playlists. */
function fixSel(){
  const keys = new Set(allLists().map(l => l.key));
  let sel = (app.setup.sel || []).flatMap(x => x === '__all' ? admin.lists.map(l => 'a:' + l.name) : keys.has(x) ? [x] : keys.has('a:' + x) ? ['a:' + x] : []);
  sel = [...new Set(sel)];
  // Until someone picks, the default follows what has loaded: every main playlist, else the first one there is.
  if (!sel.length || app.setup.selAuto){

/* ---------- YouTube playlist import ---------- */
function ytPlaylistId(u){
  u = String(u || '').trim();
  const m = u.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (m) return m[1];
  return /^(PL|OL|UU|FL|RD)[A-Za-z0-9_-]{10,}$/.test(u) ? u : null;
}
const JUNK = /\s*[\(\[][^\)\]]*\b(official|video|audio|lyrics?|visuali[sz]er|hd|hq|4k|remaster(ed)?|explicit|clean|mv|m\/v|music video|videoclip|clip officiel)\b[^\)\]]*[\)\]]/gi;
/* "Artist - Title (Official Video)" → { artist, title, sure } */
function splitTitle(raw, channel){
  let t = String(raw).replace(JUNK, '').replace(/\s*\|.*$/, '').replace(/\s+/g, ' ').trim();
  const m = t.match(/^(.+?)\s+[-–—~]\s+(.+)$/);
  const unq = x => x.replace(/^["“'‘]+|["”'’]+$/g, '').trim();
  if (m) return { artist: unq(m[1]), title: unq(m[2]), sure: true };
  const ch = String(channel || '').replace(/\s*-\s*Topic$/i, '').replace(/VEVO$/i, '').trim();
  return { artist: ch, title: unq(t), sure: false };
}
async function ytFetchPlaylist(pid, onPage){
  const out = [], seen = new Set(); let token = '';
  for (let page = 0; page < 20; page++){
    const u = 'https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=' + encodeURIComponent(pid) + '&key=' + encodeURIComponent(YT_API_KEY) + (token ? '&pageToken=' + token : '');
    const r = await fetch(u);
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ const reason = j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason; throw new Error(reason === 'playlistNotFound' ? 'notfound' : 'api'); }
    (j.items || []).forEach(it => {
      const sn = it.snippet || {}, id = (sn.resourceId || {}).videoId;
      if (!id || seen.has(id) || /^(Deleted|Private) video$/i.test(sn.title || '')) return;
      seen.add(id);
      const pub = (it.contentDetails || {}).videoPublishedAt;
      out.push({ id, raw: sn.title || '', channel: sn.videoOwnerChannelTitle || '', upYear: pub ? +pub.slice(0, 4) : null });
    });
    if (onPage) onPage(out.length);
    if (!j.nextPageToken) break; token = j.nextPageToken;
  }
  return out;
}
const lq = s => '"' + String(s).replace(/["\\]/g, ' ').trim() + '"';
const mainArtist = a => String(a).split(/\s+(?:ft\.?|feat\.?|featuring|with|x|&|and|vs\.?)\s+|,\s*/i)[0].trim();
const bareTitle = t => String(t).replace(/\s*[\(\[](?:ft\.?|feat\.?|featuring|with)\b[^\)\]]*[\)\]]/gi, '').replace(/\s+(?:ft\.?|feat\.?)\s+.*$/i, '').trim();
/* Earliest release year in MusicBrainz for a confident match. Returns { year, note } (note = why to check). */
async function lookupYear(s){
  const q = 'recording:' + lq(bareTitle(s.title)) + ' AND artist:' + lq(mainArtist(s.artist));
  let j = null;
  for (let tries = 0; tries < 3 && !j; tries++){
    try{
      const r = await fetch('https://musicbrainz.org/ws/2/recording?fmt=json&limit=25&query=' + encodeURIComponent(q));
      if (r.status === 503){ await sleep(1500); continue; }
      if (!r.ok) break;
      j = await r.json();
    }catch(e){ await sleep(1000); }
  }
  if (!j) return { year: s.upYear, note: 'Year lookup failed, so this is the YouTube upload year.' };
  const years = (j.recordings || []).filter(r => r.score >= 90 && r['first-release-date']).map(r => +r['first-release-date'].slice(0, 4)).filter(y => y >= 1900);
  if (!years.length) return { year: s.upYear, note: 'Not found in the music database, so this is the YouTube upload year.' };
  const year = Math.min(...years);
  const count = {}; years.forEach(y => count[y] = (count[y] || 0) + 1);
  const common = +Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  if (s.upYear && year > s.upYear) return { year, note: 'Found ' + year + ', but the video was uploaded in ' + s.upYear + '.' };
  if (common - year > 1) return { year, note: 'Sources disagree: earliest ' + year + ', most listed ' + common + '.' };
  if (years.length === 1) return { year, note: 'Only one match found.' };
  return { year, note: '' };
}
const songUrl = s => 'https://youtu.be/' + s.id + (s.start ? '?t=' + s.start : '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let importRun = 0;
async function startImport(url){
  const pid = ytPlaylistId(url);
  if (!pid){ app.impMsg = 'That is not a YouTube playlist link. Open the playlist in YouTube, tap Share and copy the link (it contains "list=").'; return; }
  const run = ++importRun;
  app.draftMsg = null; app.draft = { name: '', url, songs: [], stage: 'fetch', done: 0 };
  app.impMsg = null; app.screen = 'import'; render();
  let items;
  try{ items = await ytFetchPlaylist(pid, n => { if (run !== importRun) return; app.draft.done = n; render(); }); }
  catch(e){ if (run !== importRun) return; app.draft = null; app.screen = 'library'; app.impMsg = e.message === 'notfound' ? 'YouTube could not find that playlist. Make sure it is Public or Unlisted, not Private.' : 'Could not read the playlist from YouTube. Try again in a minute.'; render(); return; }
  if (run !== importRun) return;
  if (!items.length){ app.draft = null; app.screen = 'library'; app.impMsg = 'That playlist has no playable videos.'; render(); return; }
  const D = app.draft;
  D.songs = items.map(it => { const t = splitTitle(it.raw, it.channel); return { id: it.id, artist: t.artist, title: t.title, year: it.upYear, start: 0, upYear: it.upYear, raw: it.raw, note: t.sure ? '' : 'Check artist and title.', on: true }; });
  D.stage = 'years'; D.done = 0; saveDraft(); render();
  for (const s of D.songs){
    if (run !== importRun || D.stage !== 'years') return;
    const t0 = Date.now();
    const r = await lookupYear(s);
    if (run !== importRun) return;
    if (D.stage !== 'years') return;
    s.year = r.year; if (r.note) s.note = (s.note ? s.note + ' ' : '') + r.note;
    D.done++; saveDraft(); render();
    await sleep(Math.max(0, 1100 - (Date.now() - t0)));   // MusicBrainz allows about 1 request a second
  }
  if (run === importRun && D.stage === 'years'){ D.stage = 'review'; saveDraft(); render(); }
}

/* ---------- shared playlists (every device) ----------
   SHARED_URL is a Google Apps Script web app (apps-script/shared-playlists.gs) over a Sheet only the owner
   can open. GET lists the playlists; POST can only add one. Nobody can edit or delete through it: the owner
   tidies up by deleting rows in the Sheet. Cached in nd_shared so the list shows instantly and offline. */
const SHARED_URL = '';

function cleanList(o){
  if (!o || !o.id) return null;
  const songs = [], seen = new Set();
  (Array.isArray(o.songs) ? o.songs : []).forEach(r => {
    const id = String(r.id || ''), year = +r.year;
    if (!/^[A-Za-z0-9_-]{11}$/.test(id) || seen.has(id) || !(year >= 1900 && year <= 2100)) return;
    seen.add(id); songs.push({ id, artist: String(r.artist || '').slice(0, 200), title: String(r.title || '').slice(0, 200), year, start: Math.max(0, +r.start || 0) });
  });

}
async function publish(list){

const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function djIndex(G){
  if (G.sd){ const o = G.sd.order, i = o.indexOf(G.current); return o[(i + 1) % o.length]; }
  return G.players.length === 1 ? G.current : (G.current + 1) % G.players.length;
}
function gapOk(G, ids, g, year){
  const prev = g > 0 ? G.songs[ids[g-1]].year : -Infinity;

  players.forEach(p => p.timeline.push(deck.pop()));

    placement: null, named: false, challenger: null, challengeGap: null, result: null, sd: null, over: null,

function endOutOfSongs(){

  const pool = G.sd ? G.sd.order : G.players.map((_, i) => i);

  const winners = pool.filter(i => G.players[i].timeline.length === max);

function endTurn(){

  if (roundEnded){
    const reached = G.players.map((p, i) => i).filter(i => G.players[i].timeline.length >= TARGET);
    if (reached.length){
      const max = Math.max(...reached.map(i => G.players[i].timeline.length));
      const top = reached.filter(i => G.players[i].timeline.length === max);
      if (top.length === 1){ G.over = { winners: top, reason: 'target' }; G.phase = 'over'; horn(); return; }

function sdNext(){

  const right = sd.order.filter(i => sd.results[i]);
  if (right.length === 1){ G.over = { winners: right, reason: 'sudden' }; G.phase = 'over'; horn(); return; }
  if (right.length) sd.order = right;

}
function eligibleChallengers(G){

function reveal(){

  const ok = gapOk(G, A.timeline, G.placement, y);
  const ch = G.challenger;
  const chOk = ch != null && !ok && gapOk(G, A.timeline, G.challengeGap, y);
  const r = { type: 'placed', ok, chOk, ch, named: false, tokenCapped: false, newId: null, owner: null };
  if (ch != null) G.players[ch].tokens -= CHALLENGE_COST;
  if (G.named && !G.sd){ if (A.tokens < MAX_TOKENS){ A.tokens++; r.named = true; } else r.tokenCapped = true; }
  if (ok){ A.timeline.splice(G.placement, 0, G.song); r.newId = G.song; r.owner = G.current; }

  if (!app.setup.sel.includes('m:' + list.id)) app.setup.sel.push('m:' + list.id);
  if (SHARED_URL) await shareOne(list); else { app.libMsg = { kind: 'good', text: 'Saved "' + list.name + '" on this device.' }; render(); }
}
async function shareOne(list){
  app.libMsg = { kind: '', text: 'Adding "' + list.name + '" to the shared list…' }; render();
  try{
    const sid = await publish(list);
    list.sharedId = sid; saveMine();
    const was = app.setup.sel.includes('m:' + list.id);
    await loadShared();
    if (was){ app.setup.sel = app.setup.sel.filter(k => k !== 'm:' + list.id); if (shared.lists.some(l => l.id === sid)) app.setup.sel.push('s:' + sid); fixSel(); }
    app.libMsg = { kind: 'good', text: '"' + list.name + '" is saved and now shows on every device.' };
  }catch(e){
    app.libMsg = { kind: 'bad', text: '"' + list.name + '" is saved on this device, but could not be added to the shared list. Try "Share with everyone" again later.' };
  }
  render();
}

let actx = null;
/* Real airhorn recording (airhorn.mp3, supplied by the user).
   Falls back to the synthesized horn if the file is missing or the browser refuses to play it. */
let hornAudio = null;
try{ hornAudio = new Audio('airhorn.mp3'); hornAudio.preload = 'auto'; }catch(e){ hornAudio = null; }
function horn(force){
  if (!app.sound && !force) return;
  if (hornAudio && !hornAudio.error){
    try{
      hornAudio.currentTime = 0;
      const p = hornAudio.play();
      if (p && p.catch) p.catch(() => synthHorn());
      return;
    }catch(e){}
  }
  synthHorn();
}
function synthHorn(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.02;
    const out = actx.createGain(); out.gain.value = 0.22;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    const ws = actx.createWaveShaper(); const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++){ const x = i / 128 - 1; curve[i] = Math.tanh(2.5 * x); } ws.curve = curve;
    lp.connect(ws); ws.connect(out); out.connect(actx.destination);
    [[0, .16], [.21, .16], [.42, .85]].forEach(([st, d]) => {
      [[440, 1], [443, .9], [220, .6], [660, .35], [880, .2]].forEach(([f, v]) => {
        const o = actx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f * .93, t0 + st); o.frequency.exponentialRampToValueAtTime(f, t0 + st + .06);
        const g = actx.createGain(); g.gain.setValueAtTime(0, t0 + st);
        g.gain.linearRampToValueAtTime(.18 * v, t0 + st + .015);
        g.gain.setValueAtTime(.18 * v, t0 + st + d - .04); g.gain.linearRampToValueAtTime(0, t0 + st + d);
        o.connect(g); g.connect(lp); o.start(t0 + st); o.stop(t0 + st + d + .05);
      });
    });
  }catch(e){}
}

function slotLabel(G, ids, g){

        ${el.length ? `<p class="muted small">Whoever shouted first: tap their name. It costs ${CHALLENGE_COST} token. The DJ can't challenge.</p>
          <div class="chips">${el.map(i => `<button class="chip ${G.challenger === i ? 'sel' : ''}" data-act="challenger" data-v="${i}" aria-pressed="${G.challenger === i}">${pdot(G.players[i].color)}${esc(G.players[i].name)} <span class="n">${G.players[i].tokens}</span></button>`).join('')}</div>
          ${ch ? `<p><b>${esc(ch.name)}</b>, tap a different gap in ${esc(A.name)}'s timeline.${G.challengeGap != null ? ' Picked: ' + slotLabel(G, A.timeline, G.challengeGap) + '.' : ''}</p>` : ''}`
        : `<p class="muted small">Nobody else has a token to challenge with.</p>`}</div>`;
    }
    const ready = G.challenger == null || G.challengeGap != null;
    return `<div class="stage-head"><p class="eyebrow">${turnLine}</p><h2>${pdot(A.color)}${esc(A.name)} locked in ${slotLabel(G, A.timeline, G.placement)}</h2></div>
      <div class="stage-body"><div class="stage-col">${namedBlock}${chBlock}
      <div class="row"><button class="btn primary big" data-act="reveal" ${ready ? '' : 'disabled'}>Reveal</button>
      ${!ready ? `<span class="muted small">Waiting for ${esc(ch.name)} to pick a gap.</span>` : ''}</div></div></div>`;
  }
  if (G.phase === 'reveal'){
    const r = G.result;
    if (r.type === 'bought') return `<div class="stage-head"><p class="eyebrow">${turnLine}</p><h2>${pdot(A.color)}${esc(A.name)} bought the card</h2></div>
      <div class="stage-body">${yearCard(s, A.color, 'bigcard')}<div class="stage-col"><div class="lines"><span>Paid ${BUY_COST} tokens. It's now in the timeline.</span></div>
      <div class="row"><button class="btn primary big" data-act="next">Next turn</button></div></div></div>`;
    const ch = r.ch != null ? G.players[r.ch] : null;
    const cardColor = r.ok ? A.color : r.chOk ? ch.color : '#7d7799';
    const head = r.ok ? `<p class="outcome good">Correct!</p>` : r.chOk ? `<p class="outcome good">Stolen by ${esc(ch.name)}!</p>` : `<p class="outcome bad">Wrong</p>`;
    const lines = [];
    if (r.ok) lines.push(`The card stays in <b>${esc(A.name)}</b>'s timeline.`);
    else if (r.chOk) lines.push(`<b>${esc(ch.name)}</b> called it and takes the card.`);
    else lines.push(`The card is discarded.`);
    if (ch) lines.push(`${esc(ch.name)} spent ${CHALLENGE_COST} token on the challenge${r.ok ? ' and lost it' : ''}.`);
    if (r.named) lines.push(`${esc(A.name)} named it: +1 token.`);
    if (r.tokenCapped) lines.push(`${esc(A.name)} named it, but is already at ${MAX_TOKENS} tokens.`);
    const nextLabel = G.sd ? 'Continue' : (G.current === G.players.length - 1 && G.players.some(p => p.timeline.length >= TARGET) ? 'Finish round' : 'Next turn');
    return `<div class="stage-head"><p class="eyebrow">${turnLine}</p>${head}</div>
      <div class="stage-body">${yearCard(s, cardColor, 'bigcard')}<div class="stage-col"><div class="lines">${lines.map(l => `<span>${l}</span>`).join('')}</div>
      <div class="row"><button class="btn primary big" data-act="next">${nextLabel}</button>
      ${G.players.length > 1 ? `<span class="muted small">Pass the ${matchMedia('(max-width:699px)').matches ? 'phone' : 'iPad'} to ${esc(G.players[G.sd ? G.current : (G.current + 1) % G.players.length].name)}.</span>` : ''}</div></div></div>`;
  }
  return '';
}

function vGame(){
  const G = app.game;
  if (G.phase === 'over') return vOver();
  const A = G.players[G.current];
  return `${vTopbar()}<section class="stage" aria-live="polite">${vStage()}</section>
    <section class="board" aria-label="${esc(A.name)}'s timeline">
      <div class="board-head">${pdot(A.color)}<h2>${esc(A.name)}'s timeline</h2><span class="count">${A.timeline.length} / ${TARGET}</span></div>
      ${vTimeline()}
    </section>`;
}

function vOver(){
  const G = app.game, o = G.over;
  const names = o.winners.map(i => esc(G.players[i].name));
  const title = G.players.length === 1 ? (G.players[0].timeline.length >= TARGET ? 'You made it!' : 'Out of songs') : (o.winners.length === 1 ? names[0] + ' wins!' : 'Shared win: ' + names.join(' & '));
  const why = { target: `First to ${TARGET} cards.`, sudden: 'Won the sudden death.', songs: 'The songs ran out, so most cards wins.' }[o.reason];
  const order = G.players.map((p, i) => i).sort((a, b) => G.players[b].timeline.length - G.players[a].timeline.length);
  return `${vTopbar()}<section class="stage"><p class="eyebrow">Game over</p><h1 class="win-title">${title}</h1><p class="muted">${why}</p>
    <div class="standings">${order.map(i => { const p = G.players[i]; return `<div>${pdot(p.color)}<b>${esc(p.name)}</b>${tokens(p.tokens)}<span class="pts">${p.timeline.length} cards</span></div>`; }).join('')}</div>
    <div class="row"><button class="btn primary big" data-act="playAgain">Play again</button><button class="btn ghost big" data-act="finish">Home</button></div></section>`;
}

/* ---------- render ---------- */
const root = document.getElementById('app');
function render(){
  if (app.screen === 'game' && !app.game) app.screen = 'home';
  root.innerHTML = app.screen === 'setup' ? vSetup() : app.screen === 'library' ? vLibrary() : app.screen === 'import' ? vImport() : app.screen === 'game' ? vGame() : vHome();
  const q = document.getElementById('qr');
  if (q){
    if (window.QRCode){ try{ new QRCode(q, { text: q.dataset.url, width: 440, height: 440, colorDark: '#17132b', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }catch(e){ q.textContent = 'Could not draw the QR code. Open the link below on the music phone.'; } }
    else { q.innerHTML = '<p style="color:#17132b;font-size:14px">QR code library did not load. Type or share the link below on the music phone.</p>'; }
  }
  save();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) {
    if (app.menu && !e.target.closest('.tools')){ app.menu = false; app.confirm = null; render(); }
    return;
  }
  const name = el.dataset.act;
  if (!A[name]) return;
  const before = app.confirm;
  const res = A[name](el.dataset.v, el);
  if (res !== 'keep' && before === app.confirm) app.confirm = null;
  if (name !== 'menu' && name !== 'sound' && name !== 'endGame' && name !== 'testHorn') app.menu = false;
  render();
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset && t.dataset.dr; if (!f || !app.draft) return;
  const row = t.closest('[data-i]'), x = app.draft.songs[+row.dataset.i];
  if (f === 'year'){ const v = t.value.trim(); const ok = /^\d{4}$/.test(v) && +v >= 1900 && +v <= 2100; t.classList.toggle('bad', !ok); if (ok){ x.year = +v; x.note = ''; } }
  else if (f === 'start'){ const v = parseStart(t.value); if (v != null){ x.start = v; t.value = v; } else t.value = x.start || 0; }
  else { x[f] = t.value; if (x.note === 'Check artist and title.') x.note = ''; }
  saveDraft();
});
document.addEventListener('input', e => {
  if (e.target.id === 'dName' && app.draft){ app.draft.name = e.target.value; return; }
  const i = e.target.dataset && e.target.dataset.name;
  if (i != null){ app.setup.players[+i].name = e.target.value; save(); }
});

/* ---------- drag to place ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el || !app.game || app.game.phase !== 'place' || e.button > 0) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.classList.add('ghost'); ghost.removeAttribute('data-drag');
  ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
  ghost.style.setProperty('--cw', Math.min(r.width, 108) + 'px');
  document.body.appendChild(ghost);
  drag = { el, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false, hot: null, id: e.pointerId };
  el.classList.add('lifting');
  moveGhost(e);
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
});
function moveGhost(e){ drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px'; }
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
  moveGhost(e);
  const tl = document.getElementById('timeline');
  if (tl){ const tr = tl.getBoundingClientRect(); if (tl.scrollWidth > tl.clientWidth){ if (e.clientX < tr.left + 50) tl.scrollLeft -= 12; else if (e.clientX > tr.right - 50) tl.scrollLeft += 12; } }
  const cands = [...document.querySelectorAll('#timeline .slot.live, #timeline .ycard.mystery.placed')];
  let best = null, bd = Infinity;
  cands.forEach(s => { const r = s.getBoundingClientRect(); const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)); if (d < bd){ bd = d; best = s; } });
  document.querySelectorAll('.slot.hot').forEach(s => s.classList.remove('hot'));
  if (best && bd < 240){ if (best.classList.contains('slot')) best.classList.add('hot'); drag.hot = +best.dataset.gap; } else drag.hot = null;
});
function endDrag(){
  if (!drag) return; const d = drag; drag = null;
  d.ghost.remove(); d.el.classList.remove('lifting');
  document.querySelectorAll('.slot.hot').forEach(s => s.classList.remove('hot'));
  if (d.moved && d.hot != null && d.hot !== app.game.placement){ A.placeAt(d.hot); render(); }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ---------- boot ---------- */
function boot(){
  if (app.game && app.game.phase !== 'over' && store.get('nd_screen', null) === 'game') app.screen = 'game';
  const d = store.get('nd_draft', null);
  if (d && d.songs && d.songs.length){ if (d.stage !== 'review') d.stage = 'review'; app.draft = d; if (app.screen !== 'game') app.screen = 'import'; }
  fixSel();
  render();
}
window.addEventListener('pagehide', () => store.set('nd_screen', app.screen));
setInterval(() => store.set('nd_screen', app.screen), 4000);
boot();
loadAdmin();
loadShared();
})();
</script>
</body>
